# WeRU.B PACS — canonical single-institution standalone deployment.
# Self-contained (own postgres/redis); no HospitalRun coexistence. Bridge
# network with service-name DNS; secrets come from .env only (see .env.example).
# Core services run by default; monitoring is opt-in:  --profile monitoring
#
#   cp .env.example .env   # then set every CHANGE_ME (openssl rand -base64 32)
#   docker compose up -d --build
#
# DICOM/MWL/HL7 listeners bind to ${DICOM_BIND} (default 127.0.0.1). To receive
# C-STORE from modalities, set DICOM_BIND=0.0.0.0 (or the LAN IP) in .env and
# firewall the device network — see docs/cstore-pilot-readiness.md.

# ── shared backend env (everything except DATABASE_URL, which differs:
#    backend uses asyncpg, the celery/scp workers use the sync driver) ──
x-app-env: &app-env
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  ORTHANC_URL: http://orthanc:8042
  ORTHANC_USERNAME: ${ORTHANC_USERNAME}
  ORTHANC_PASSWORD: ${ORTHANC_PASSWORD}
  ORTHANC_AET: ${ORTHANC_AET}
  SECRET_KEY: ${SECRET_KEY}
  INSTITUTION_NAME: ${INSTITUTION_NAME}
  INSTITUTION_ID: ${INSTITUTION_ID}
  TIMEZONE: ${TIMEZONE}
  BASE_URL: ${BASE_URL}
  PREFETCH_WARM_BASE_URL: ${PREFETCH_WARM_BASE_URL}
  AI_SERVER_URL: ${AI_SERVER_URL}
  AI_API_KEY: ${AI_API_KEY}
  AI_MEDICAL_KEY: ${AI_MEDICAL_KEY}
  HOSPITALRUN_AUTH_SECRET: ${HOSPITALRUN_AUTH_SECRET}
  HIS_JWKS_URL: ${HIS_JWKS_URL}
  HIS_JWT_AUDIENCE: ${HIS_JWT_AUDIENCE}
  HIS_JWT_ISSUER: ${HIS_JWT_ISSUER}
  HOSPITALRUN_DB_URL: ${HOSPITALRUN_DB_URL}
  SIGN_SERVICE_ENABLED: ${SIGN_SERVICE_ENABLED}
  SIGN_SERVICE_URL: ${SIGN_SERVICE_URL}
  SIGN_SERVICE_API_KEY: ${SIGN_SERVICE_API_KEY}
  SIGN_PORTAL_BASE_URL: ${SIGN_PORTAL_BASE_URL}
  PATIENT_EXPORT_ENABLED: ${PATIENT_EXPORT_ENABLED}
  PATIENT_EXPORT_SECRET: ${PATIENT_EXPORT_SECRET}
  PATIENT_VIEW_ENABLED: ${PATIENT_VIEW_ENABLED:-false}
  ATNA_ENABLED: ${ATNA_ENABLED}
  ATNA_HOST: ${ATNA_HOST}
  ATNA_PORT: ${ATNA_PORT}
  ATNA_TRANSPORT: ${ATNA_TRANSPORT}

x-backend-build: &backend-build
  build:
    context: ./backend
    dockerfile: Dockerfile

x-app-deps: &app-deps
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  # ===== PostgreSQL =====
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TIMEZONE}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== Redis =====
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== Orthanc DICOM Server =====
  orthanc:
    image: orthancteam/orthanc:24.12.2
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ORTHANC__POSTGRESQL__HOST: postgres
      ORTHANC__POSTGRESQL__PORT: 5432
      ORTHANC__POSTGRESQL__DATABASE: ${POSTGRES_DB}
      ORTHANC__POSTGRESQL__USERNAME: ${POSTGRES_USER}
      ORTHANC__POSTGRESQL__PASSWORD: ${POSTGRES_PASSWORD}
      ORTHANC__POSTGRESQL__ENABLE_INDEX: "true"
      ORTHANC__POSTGRESQL__ENABLE_STORAGE: "false"
      ORTHANC__DICOM_AET: ${ORTHANC_AET}
      ORTHANC__REGISTERED_USERS: |
        {"${ORTHANC_USERNAME}": "${ORTHANC_PASSWORD}"}
      # DICOM TLS(옵션, default-off) — 모달리티망 DIMSE 암호화. 활성 시 4242가 TLS 전용.
      # 인증서: scripts/install/gen-dicom-tls.sh → docker/orthanc/tls/
      ORTHANC__DICOM_TLS_ENABLED: ${ORTHANC_DICOM_TLS_ENABLED:-false}
      ORTHANC__DICOM_TLS_REMOTE_CERTIFICATE_REQUIRED: ${ORTHANC_DICOM_TLS_MUTUAL:-false}
      VERBOSE_STARTUP: "true"
    volumes:
      - orthanc_data:/var/lib/orthanc/db
      - ./docker/orthanc/orthanc.json:/etc/orthanc/orthanc.json:ro
      - ./docker/orthanc/tls:/etc/orthanc/tls:ro
    ports:
      - "127.0.0.1:${ORTHANC_HTTP_PORT}:8042"
      - "${DICOM_BIND}:${ORTHANC_DICOM_PORT}:4242"   # C-STORE/FIND/MOVE
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8042/system || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ===== FastAPI Backend =====
  backend:
    <<: [*backend-build, *app-deps]
    restart: unless-stopped
    environment:
      <<: *app-env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - consents:/data/consents
      - export_staging:/app/export-staging
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== Celery worker (AI inference, prefetch, export, default) =====
  celery-worker:
    <<: [*backend-build, *app-deps]
    restart: unless-stopped
    command: celery -A app.services.celery_entry.celery_app worker -Q ai_inference,default,prefetch,export -c ${CELERY_CONCURRENCY:-2} --loglevel=info
    environment:
      <<: *app-env
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - export_staging:/app/export-staging

  # ===== Celery beat (scheduler: SLA, auto-validate, screening, governance) =====
  celery-beat:
    <<: [*backend-build, *app-deps]
    restart: unless-stopped
    command: celery -A app.services.celery_entry.celery_app beat --loglevel=info
    environment:
      <<: *app-env
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - export_staging:/app/export-staging

  # ===== MWL SCP (DIMSE Modality Worklist) =====
  mwl-scp:
    <<: [*backend-build, *app-deps]
    restart: unless-stopped
    command: python -m app.services.mwl_scp
    environment:
      <<: *app-env
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MWL_BIND: "0.0.0.0"
      MWL_PORT: "4243"
      MWL_AE_TITLE: ${MWL_AE_TITLE}
    ports:
      - "${DICOM_BIND}:${MWL_PORT}:4243"

  # ===== HL7 v2 listener (MLLP) =====
  hl7-listener:
    <<: [*backend-build, *app-deps]
    restart: unless-stopped
    command: python -m app.services.hl7_listener
    environment:
      <<: *app-env
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      HL7_BIND: "0.0.0.0"
      HL7_PORT: "2575"
      HL7_ALLOWED_PEERS: "${HL7_ALLOWED_PEERS:-}"
      HL7_ALLOWED_FACILITIES: "${HL7_ALLOWED_FACILITIES:-}"
    ports:
      - "${DICOM_BIND}:${HL7_PORT}:2575"

  # ===== Admin console (Next.js, served at /pacs-admin) =====
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend

  # ===== WeRU.B Viewer (OHIF-based, served at /werub-viewer) =====
  # Builds from werub-viewer/dist (pre-built; rebuild with werub-viewer/build.sh).
  werub:
    build:
      context: ./werub-viewer
      dockerfile: Dockerfile
    restart: unless-stopped

  # ===== Nginx Reverse Proxy (the only public entrypoint) =====
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      orthanc:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      # base64("user:pass") injected as the Orthanc upstream auth header. The
      # nginx image envsubst's templates/*.template at startup. Compute with:
      #   ORTHANC_BASIC_AUTH=$(printf '%s:%s' "$ORTHANC_USERNAME" "$ORTHANC_PASSWORD" | base64)
      ORTHANC_BASIC_AUTH: ${ORTHANC_BASIC_AUTH}
    ports:
      - "${NGINX_HTTP_PORT}:80"
      - "${NGINX_HTTPS_PORT}:443"
    volumes:
      - ./docker/nginx/templates:/etc/nginx/templates:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/nginx-health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== Monitoring (opt-in: docker compose --profile monitoring up) =====
  prometheus:
    image: prom/prometheus:v2.54.0
    profiles: ["monitoring"]
    restart: unless-stopped
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT}:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'

  alertmanager:
    image: prom/alertmanager:v0.27.0
    profiles: ["monitoring"]
    restart: unless-stopped
    volumes:
      # <WEBHOOK_TOKEN>을 backend env ALERTMANAGER_WEBHOOK_TOKEN 값으로 치환해 배치
      - ./docker/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable

  redis-exporter:
    image: oliver006/redis_exporter:latest
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379

  grafana:
    image: grafana/grafana:11.2.0
    profiles: ["monitoring"]
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT}:3000"

  node-exporter:
    image: prom/node-exporter:v1.8.2
    profiles: ["monitoring"]
    restart: unless-stopped
    command: ['--web.listen-address=:9100']

volumes:
  postgres_data:
  redis_data:
  orthanc_data:
  prometheus_data:
  grafana_data:
  consents:
  export_staging:
