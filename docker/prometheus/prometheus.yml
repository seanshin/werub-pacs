global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'orthanc'
    metrics_path: '/tools/metrics-prometheus'
    basic_auth:
      username: 'admin'
      password: 'changeme_orthanc_2026'
    static_configs:
      - targets: ['orthanc:8042']
        labels:
          service: 'orthanc'

  - job_name: 'fastapi'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:8000']
        labels:
          service: 'backend'

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # postgres/redis는 exporter 경유 (직접 포트 스크레이프는 메트릭이 나오지 않음)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgres'

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis'
